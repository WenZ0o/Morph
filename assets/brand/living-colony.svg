<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#09151d"/>
    <stop offset="55%" stop-color="#071017"/>
    <stop offset="100%" stop-color="#030609"/>
  </linearGradient>
  <radialGradient id="ivory" cx="35%" cy="28%" r="75%">
    <stop offset="0%" stop-color="#fffdf6"/>
    <stop offset="42%" stop-color="#f5edd9"/>
    <stop offset="72%" stop-color="#d9c9aa"/>
    <stop offset="100%" stop-color="#8d816b"/>
  </radialGradient>
  <radialGradient id="cyan" cx="38%" cy="30%" r="75%">
    <stop offset="0%" stop-color="#e9ffff"/>
    <stop offset="30%" stop-color="#a7f9ff"/>
    <stop offset="60%" stop-color="#55e6ef"/>
    <stop offset="100%" stop-color="#14606b"/>
  </radialGradient>
  <radialGradient id="pore" cx="35%" cy="35%" r="75%">
    <stop offset="0%" stop-color="#5d6263"/>
    <stop offset="100%" stop-color="#0a0d0f"/>
  </radialGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="18" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
  </filter>
  <linearGradient id="membrane" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#bdfcff" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#5fcbd4" stop-opacity="0.05"/>
  </linearGradient>
</defs>

